intro: "Common [FastQC](/biotool#fastqc) issues and fixes."
note: ""
warning: "Most failures are caused by unreadable or malformed input files rather than report generation logic."
protip: "Reduce scope to one sample when debugging, then scale once the minimal run is clean."
