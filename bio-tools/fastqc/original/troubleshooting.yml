    issue: "OutOfMemoryError on large files"
    fix: "Increase heap, e.g. `export _JAVA_OPTIONS=\"-Xmx4G\"`."
  HTML_RENDER:
    issue: "HTML report display issues"
    fix: "Serve report directory via `python -m http.server`."
