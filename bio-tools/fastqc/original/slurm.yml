intro: |
  [FastQC](/biotool#fastqc) can process multiple input files in one command, but for large cohorts on SLURM you should choose an explicit batch strategy based on cores, queue policy, and logging needs.

note: |
  *method* | *How it runs?* | *When to use?* | *notes*  
  **fastqc_multi_input** | one FastQC command with many inputs | fastest setup; minimal scripting; internal threading | single command path, less granular control  
  **sequential_loop** | single job; samples processed one-by-one | simple; when CPU usage is limited | one job log, stable baseline, easiest debugging  
  **GNU-Parallel** | single job; multiple samples processed in parallel | preferred for multi-core nodes | best throughput on high-core nodes  
  **SLURM Job Array** | separate job per input file | ideal for HPC environments; better log separation | scheduler-managed fan-out and per-task logs  

