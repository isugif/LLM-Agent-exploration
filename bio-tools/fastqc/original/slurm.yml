metadata:
  TEMPLATE_VERSION: "v1"
  defaults: {}

extra:
  title: "Enhancements & Optional Arguments"
  guide: "This section shows optional flags that enhance FastQC's functionality depending on input type and downstream needs."
  enhancements:
    NOGROUP:
      title: "Per-base Resolution (`--nogroup`)"
      guide: "Use when read lengths are long and you need unbinned per-position quality trends."
      command: |
        ```bash
        fastqc --nogroup -t 8 -o "$OUT" "$IN"/*.fastq.gz
        ```

    EXTRACT:
      title: "Auto-extract ZIP Contents (`--extract`)"
      guide: "Expands report archives immediately so downstream parsing can read uncompressed result files."
      command: |
        ```bash
        fastqc --extract -t 8 -o "$OUT" "$IN"/*.fastq.gz
        ```

    KMERS:
      title: "Custom K-mer Size (`--kmers`)"
      guide: "Adjust k-mer analysis sensitivity for targeted artifact inspection."
      command: |
        ```bash
        fastqc --kmers 10 -t 8 -o "$OUT" "$IN"/*.fastq.gz
        ```
