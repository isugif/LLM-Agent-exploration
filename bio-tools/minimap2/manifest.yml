# Per-tool index. Validates against shared/sections/schemas.py:Manifest.
# minimap2 is a single-command read aligner. Its machine sections are HUMAN-REVIEWED (no HRR_
# markers), so the judgment harness will route it. Alignment takes TWO inputs — reads ({input}) and
# a reference FASTA ({reference}); a missing reference is refused before compute (see preconditions).
tool: minimap2
version: "2.28"
sections:
  # --- machine sections (assembled into the contract) ---
  - {name: meta,          purpose: "summary + expectations link",          load_when: always, machine: true,  path: clean/meta.yml}
  - {name: execution,     purpose: "how to run + install hint",             load_when: always, machine: true,  path: clean/execution.yml}
  - {name: preconditions, purpose: "assertable input preconditions",        load_when: always, machine: true,  path: clean/preconditions.yml}
  - {name: must_not_use,  purpose: "off-label boundaries",                  load_when: always, machine: true,  path: clean/must_not_use.yml}
  - {name: failure_modes, purpose: "crash signals + fixes",                 load_when: always, machine: true,  path: clean/failure_modes.yml}
  # --- context sections (loaded on demand) ---
  - {name: input,         purpose: "accepted reads + a reference FASTA",     load_when: always,           machine: false, path: clean/input.yml}
  - {name: usage,         purpose: "representative alignment invocations",   load_when: always,           machine: false, path: clean/usage.yml}
  - {name: source,        purpose: "homepage / repository / docs links",     load_when: citation_request, machine: false, path: clean/source.yml}
  - {name: citations,     purpose: "primary publication, license",           load_when: citation_request, machine: false, path: clean/citations.yml}
