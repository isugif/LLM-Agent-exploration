# CLEAN context section (curated from hisat2 --help). schemas.py:OptionsSection
options:
- flag: -q
  description: query input files are FASTQ .fq/.fastq (default)
  default: null
- flag: --qseq
  description: query input files are in Illumina's qseq format
  default: null
- flag: -f
  description: query input files are (multi-)FASTA .fa/.mfa
  default: null
- flag: -r
  description: query input files are raw one-sequence-per-line
  default: null
- flag: -c
  description: <m1>, <m2>, <r> are sequences themselves, not files
  default: null
- flag: -s / --skip <int>
  description: skip the first <int> reads/pairs in the input (none)
  default: null
- flag: -u / --upto <int>
  description: stop after first <int> reads/pairs (no limit)
  default: null
- flag: -5 / --trim5 <int>
  description: trim <int> bases from 5'/left end of reads (0)
  default: null
- flag: -3 / --trim3 <int>
  description: trim <int> bases from 3'/right end of reads (0)
  default: null
- flag: --phred33
  description: qualities are Phred+33 (default)
  default: null
- flag: --phred64
  description: qualities are Phred+64
  default: null
- flag: --int-quals
  description: qualities encoded as space-delimited integers
  default: null
- flag: --bowtie2-dp <int>
  description: 'use Bowtie2''s dynamic programming alignment algorithm (0) - 0: no dynamic programming,
    1: conditional dynamic programming, and 2: unconditional dynamic programming (slowest)'
  default: null
- flag: --n-ceil <func>
  description: 'func for max # non-A/C/G/Ts permitted in aln (L,0,0.15)'
  default: null
- flag: --ignore-quals
  description: treat all quality values as 30 on Phred scale (off)
  default: null
- flag: --nofw
  description: do not align forward (original) version of read (off)
  default: null
- flag: --norc
  description: do not align reverse-complement version of read (off)
  default: null
- flag: --no-repeat-index
  description: do not use repeat index
  default: null
- flag: --pen-cansplice <int>
  description: penalty for a canonical splice site (0)
  default: null
- flag: --pen-noncansplice <int>
  description: penalty for a non-canonical splice site (12)
  default: null
- flag: --pen-canintronlen <func>
  description: penalty for long introns (G,-8,1) with canonical splice sites
  default: null
- flag: --pen-noncanintronlen <func>
  description: penalty for long introns (G,-8,1) with noncanonical splice sites
  default: null
- flag: --min-intronlen <int>
  description: minimum intron length (20)
  default: null
- flag: --max-intronlen <int>
  description: maximum intron length (500000)
  default: null
- flag: --known-splicesite-infile <path>
  description: provide a list of known splice sites
  default: null
- flag: --novel-splicesite-outfile <path>
  description: report a list of splice sites
  default: null
- flag: --novel-splicesite-infile <path>
  description: provide a list of novel splice sites
  default: null
- flag: --no-temp-splicesite
  description: disable the use of splice sites found
  default: null
- flag: --no-spliced-alignment
  description: disable spliced alignment
  default: null
- flag: --rna-strandness <string>
  description: specify strand-specific information (unstranded)
  default: null
- flag: --tmo
  description: reports only those alignments within known transcriptome
  default: null
- flag: --dta
  description: reports alignments tailored for transcript assemblers
  default: null
- flag: --dta-cufflinks
  description: reports alignments tailored specifically for cufflinks
  default: null
- flag: --avoid-pseudogene
  description: tries to avoid aligning reads to pseudogenes (experimental option)
  default: null
- flag: --no-templatelen-adjustment
  description: disables template length adjustment for RNA-seq reads
  default: null
- flag: --mp <int>,<int>
  description: max and min penalties for mismatch; lower qual = lower penalty <6,2>
  default: null
- flag: --sp <int>,<int>
  description: max and min penalties for soft-clipping; lower qual = lower penalty <2,1>
  default: null
- flag: --no-softclip
  description: no soft-clipping
  default: null
- flag: --np <int>
  description: penalty for non-A/C/G/Ts in read/ref (1)
  default: null
- flag: --rdg <int>,<int>
  description: read gap open, extend penalties (5,3)
  default: null
- flag: --rfg <int>,<int>
  description: reference gap open, extend penalties (5,3)
  default: null
- flag: --score-min <func>
  description: "min acceptable alignment score w/r/t read length\n                     (L,0.0,-0.2)"
  default: null
- flag: -k <int>
  description: "It searches for at most <int> distinct, primary alignments for each read.\n          \
    \           Primary alignments mean \n                     alignments whose alignment score is equal\
    \ to or higher than any other alignments.\nThe search terminates\n                     when it cannot\
    \ find more distinct valid alignments, or when it finds <int>, whichever happens first. Each reported\
    \ read or pair alignment beyond the first has the SAM \u2018secondary\u2019 bit (which equals 256)\
    \ set in its FLAGS field. For reads that have more than <int> distinct,\n                     valid\
    \ alignments, hisat2 does not guarantee that the <int> alignments reported are the best possible\n\
    \                     in terms of alignment score.\n                     Default: 5 (linear index)\
    \ or 10 (graph index).\n                     Note: HISAT2 is not designed with large values for -k\
    \ in mind,\n                     and when aligning reads to long, repetitive genomes,\n          \
    \           large -k could make alignment much slower."
  default: null
- flag: --max-seeds <int>
  description: "HISAT2, like other aligners, uses seed-and-extend approaches. HISAT2 tries to extend seeds\
    \ to full-length alignments.\n                     In HISAT2, --max-seeds is used to control the maximum\
    \ number of seeds that will be extended.\n                     For DNA-read alignment (--no-spliced-alignment),\n\
    \                     HISAT2 extends up to these many seeds and skips the rest of the seeds. For RNA-read\n\
    \                     alignment,\n                     HISAT2 skips extending seeds and reports no\
    \ alignments if the number of seeds is larger than the number specified with the option, \nto be compatible\
    \ with previous versions of HISAT2.\n                     Large values for --max-seeds may improve\
    \ alignment sensitivity,\n                     but HISAT2 is not designed with large values for --max-seeds\
    \ in mind,\n                     and when aligning reads to long, repetitive genomes,\n          \
    \           large --max-seeds could make alignment much slower. The default value\n              \
    \       is the maximum of 5 and the value that comes with -k times 2."
  default: null
- flag: -a / --all
  description: "HISAT2 reports all alignments it can find.\n                     Using the option is equivalent\
    \ to using both --max-seeds \n                     and -k with the maximum value\n               \
    \      that a 64-bit signed integer can represent (9,223,372,036,854,775,807)."
  default: null
- flag: --repeat
  description: report alignments to repeat sequences directly
  default: null
- flag: -I / --minins <int>
  description: minimum fragment length (0), only valid with --no-spliced-alignment
  default: null
- flag: -X / --maxins <int>
  description: maximum fragment length (500), only valid with --no-spliced-alignment
  default: null
- flag: --fr / --rf / --ff
  description: -1, -2 mates align fw/rev, rev/fw, fw/fw (--fr)
  default: null
- flag: --no-mixed
  description: suppress unpaired alignments for paired reads
  default: null
- flag: --no-discordant
  description: suppress discordant alignments for paired reads
  default: null
- flag: -t / --time
  description: print wall-clock time taken by search phases
  default: null
- flag: --un <path>
  description: write unpaired reads that didn't align to <path>
  default: null
- flag: --al <path>
  description: write unpaired reads that aligned at least once to <path>
  default: null
- flag: --un-conc <path>
  description: write pairs that didn't align concordantly to <path>
  default: null
- flag: --al-conc <path>
  description: write pairs that aligned concordantly at least once to <path>
  default: null
