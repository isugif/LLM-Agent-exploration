# CLEAN context section (curator-generated). Validates against schemas.py.
options:
- flag: --alphabet-guess-seq-length int
  description: length of sequence prefix of the first FASTA record based on which
    seqkit guesses the sequence type (0 for whole seq)
  default: null
- flag: --compress-level int
  description: compression level for gzip, zstd, xz and bzip2. type "seqkit -h" for
    the range and default value for each format (default -1)
  default: null
- flag: -h, --help
  description: help for seqkit
  default: null
- flag: --id-ncbi
  description: FASTA head is NCBI-style, e.g. >gi|110645304|ref|NC_002516.2| Pseud...
  default: null
- flag: --id-regexp string
  description: regular expression for parsing ID (default "^(\S+)\s?"
  default: null
- flag: -X, --infile-list string
  description: file of input files list (one file per line), if given, they are appended
    to files from cli arguments
  default: null
- flag: -w, --line-width int
  description: line width when outputting FASTA format (0 for no wrap) (default 60)
  default: null
- flag: -o, --out-file string
  description: out file ("-" for stdout, suffix .gz for gzipped out) (default "-")
  default: null
- flag: --quiet
  description: be quiet and do not show extra information
  default: null
- flag: -t, --seq-type string
  description: sequence type (dna|rna|protein|unlimit|auto) (for auto, it automatically
    detect by the first sequence) (default "auto")
  default: null
- flag: --skip-file-check
  description: skip input file checking when given a file list if you believe these
    files do exist
  default: null
- flag: -j, --threads int
  description: number of CPUs. can also set with environment variable SEQKIT_THREADS)
    (default 4)
  default: null
