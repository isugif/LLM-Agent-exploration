# CLEAN machine section (fact-only). Validates against schemas.py:MetaSection. HUMAN-REVIEWED.
summary: >
  Ultrafast cross-platform toolkit for FASTA/FASTQ manipulation — a `seqkit <command>` suite
  (stats, seq, grep, subseq, sort, rmdup, sample, split, fx2tab, ...). This contract routes the
  read-only `stats` command, which reports per-file summary statistics (sequence count, total /
  min / avg / max length, N50, GC%, and Q20/Q30 for FASTQ). It summarizes and manipulates
  sequences; it does not align, assemble, call variants, or judge quality pass/fail.
expectations_ref: seqkit_stats.yaml
category_tags: [Sequence_Data_Processing_and_Quality_Control]
