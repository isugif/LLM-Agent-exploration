# Enforceable contract for MultiQC — validates against
# ../../shared/contracts/schema/contract.schema.json
#
# MultiQC AGGREGATES other tools' reports (e.g. FastQC) into one cohort-level report. Its input is a
# directory of reports, not a FASTQ — so its onboarding probe is the report-dir probe, and its
# preconditions assert against that directory (see shared/probes/report_dir_probe.py).
id: multiqc
kind: tool
version: "1.x"
summary: >
  Aggregates results from many bioinformatics tools (FastQC, STAR, samtools, ...) across samples
  into a single interactive HTML report plus machine-readable tables. It summarizes existing
  reports; it does not itself measure read quality.

interface:
  inputs:
    - format: report_dir
      note: "a directory MultiQC scans recursively for recognized tool outputs (e.g. *_fastqc.zip)"
  outputs:
    - format: html
      note: "multiqc_report.html — the aggregated interactive report"
    - format: dir
      contains: multiqc_general_stats.txt
      note: "multiqc_data/ — per-sample tables; parse general stats for scripted QC"

execution:
  argv: [multiqc, "{input}", -o, "{out_dir}", -f]
  version_argv: [multiqc, --version]
  install_hint: "pip install multiqc  # or: mamba install -c bioconda multiqc"

# --- assertable preconditions (checked against the report-dir probe's measured facts) ---
preconditions:
  - id: input_is_report_dir
    assert: "measured.format == 'report_dir'"
    severity: block
    message: "MultiQC expects a directory of tool reports to aggregate, not a single file."
  - id: reports_present
    assert: "measured.n_reports > 0"
    severity: block
    message: "No recognized tool reports found in the input directory; nothing to aggregate."

operating_range:
  n_samples:
    recommended_min: 2
    note: "MultiQC is designed for cohorts; aggregating a single sample is valid but adds little over the underlying report."

# --- MUST-NOT-USE boundaries (judgment checks the DELIVERABLE against these) ---
must_not_use:
  - id: not_a_measurement_tool
    boundary: >
      Not a measurement tool. MultiQC only re-presents numbers already computed by other tools;
      it does not measure read quality, alignment, or duplication itself. To MEASURE, run the
      underlying tool (e.g. FastQC) — MultiQC only aggregates.
    keywords: [measure, compute quality, run qc on reads, from raw reads, calculate, quantify]
  - id: not_a_decision_maker
    boundary: >
      Not a pass/fail decision-maker or data fixer. MultiQC displays aggregated metrics; it does
      not decide sample inclusion/exclusion or modify/clean any data.
    keywords: [decide, pass or fail, exclude samples, drop samples, fix, clean, filter samples]

# --- known hard failures (diagnosis harness greps stderr/stdout for `signal`) ---
failure_modes:
  - id: no_reports_found
    signal: "No analysis results found"
    fix: "Point MultiQC at a directory that actually contains recognized tool outputs (e.g. FastQC *_fastqc.zip files)."
  - id: not_installed
    signal: "command not found"
    fix: "Install MultiQC: `pip install multiqc`."

gotchas:
  - "MultiQC infers sample names from filenames; inconsistent naming across tools splits one sample into several rows."
  - "It only shows what its input reports contain — a metric missing from the underlying tool won't appear."
  - "Version-scoped: general-stats column names and modules vary across MultiQC versions."

expectations_ref: rnaseq_qc.yaml   # reuses the assay table; only overlapping metrics (GC, duplication) score
